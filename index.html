<title>맞수</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 휴대폰 폭 한 칸(최대 460px) 앱. 이용자 화면은 하단 탭, 체육관 콘솔은 상단 탭.
   기준 이미지: 링 위의 두 코너. 내 쪽은 레드 코너, 상대 쪽은 블루 코너로 색을 고정해 대진 카드에서만 쓴다. */
:root {
  --bg: #E6E8EB; --surface: #F6F7F8; --raised: #FFFFFF; --ink: #15181D; --sub: #596270; --line: #CBD0D6;
  --red: #C0282D; --blue: #1D47B4; --good: #1B7048; --warn: #9A5B00; --bad: #B3261E;
  --red-t: #F6DDDE; --blue-t: #DCE4F7; --good-t: #D9EEE2; --warn-t: #F6E7CC;
  --bar: #15181D; --bar-ink: #F2F4F6;
  --f-display: "Black Han Sans", "Noto Sans KR", sans-serif; --f-body: "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121519; --surface: #1A1E23; --raised: #222730; --ink: #ECEFF2; --sub: #9CA6B2; --line: #2D343D;
  --red: #F0646A; --blue: #7E9DFF; --good: #5CC48F; --warn: #E3A94B; --bad: #FF8A80;
  --red-t: #3A1E20; --blue-t: #1E2A4A; --good-t: #17301F; --warn-t: #3A2E14; --bar: #0A0C0F; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121519; --surface: #1A1E23; --raised: #222730; --ink: #ECEFF2; --sub: #9CA6B2; --line: #2D343D;
  --red: #F0646A; --blue: #7E9DFF; --good: #5CC48F; --warn: #E3A94B; --bad: #FF8A80;
  --red-t: #3A1E20; --blue-t: #1E2A4A; --good-t: #17301F; --warn-t: #3A2E14; --bar: #0A0C0F; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.55 var(--f-body); word-break: keep-all; overflow-wrap: anywhere; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.app { max-width: 460px; min-height: 100vh; margin: 0 auto; background: var(--surface); display: flex; flex-direction: column; position: relative; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
@media (max-width: 480px) { .app { border: 0; } }

/* 상단 바 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); color: var(--bar-ink); display: flex; align-items: center; gap: 10px; padding: 10px max(16px, env(safe-area-inset-left, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.brand { font: 400 22px/1 var(--f-display); letter-spacing: .02em; flex: 1; min-width: 0; }
.brand small { font: 400 11px var(--f-body); opacity: .7; margin-left: 6px; letter-spacing: 0; }
.sens { font-weight: 700; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
details summary { cursor: pointer; }
.help { background: none; border: 1px solid rgba(255,255,255,.35); color: inherit; border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: nowrap; }
.guide ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.guide li { line-height: 1.55; }
.seg { display: inline-flex; background: rgba(255,255,255,.14); border-radius: 6px; padding: 2px; }
.seg button { background: none; border: 0; color: inherit; padding: 4px 9px; border-radius: 4px; font-size: 12px; opacity: .8; }
.seg button[aria-pressed="true"] { background: var(--bar-ink); color: var(--bar); opacity: 1; font-weight: 700; }

main { flex: 1; padding: 16px max(16px, env(safe-area-inset-left, 0px)) 96px; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
h1 { font: 400 26px/1.25 var(--f-display); }
h2 { font-size: 15px; font-weight: 700; }
h3 { font-size: 14px; font-weight: 700; }
p { margin: 0; }
.sub { color: var(--sub); font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.sp { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grow { min-width: 0; }

/* 하단 탭 */
.tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 460px); background: var(--raised); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 6; }
.tabs button { background: none; border: 0; padding: 12px 2px 11px; font-size: 12.5px; color: var(--sub); position: relative; }
.tabs button[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tabs button[aria-current="page"]::after { content: ""; position: absolute; left: 22%; right: 22%; top: 0; height: 3px; background: var(--red); }
.tabs .dot { position: absolute; top: 8px; right: 22%; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font-size: 10px; line-height: 16px; font-weight: 700; }
.ctabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--raised); padding: 0 max(8px, env(safe-area-inset-left, 0px)); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 46px); z-index: 4; }
.ctabs button { background: none; border: 0; padding: 11px 10px; white-space: nowrap; color: var(--sub); border-bottom: 3px solid transparent; font-size: 13px; }
.ctabs button[aria-current="page"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--red); }

/* 면 */
.panel { background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
.panel.flat { background: transparent; border-style: dashed; }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); }
.list > * { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.list > *:last-child { border-bottom: 0; }
.empty { padding: 22px 14px; color: var(--sub); text-align: left; }

/* 버튼 */
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: 5px; font-weight: 700; font-size: 13.5px; line-height: 1.2; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.sm { padding: 6px 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.link { background: none; border: 0; color: var(--blue); padding: 0; text-decoration: underline; text-underline-offset: 2px; }

/* 칩·상태 */
.chip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 3px; background: var(--bg); color: var(--sub); font-weight: 500; white-space: nowrap; }
.chip.red { background: var(--red-t); color: var(--red); } .chip.blue { background: var(--blue-t); color: var(--blue); }
.chip.good { background: var(--good-t); color: var(--good); } .chip.warn { background: var(--warn-t); color: var(--warn); }
.filter { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; background: var(--raised); }
.filter button { border: 0; background: none; padding: 7px 12px; font-size: 13px; color: var(--sub); }
.filter button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 700; }

/* 대진 카드: 레드 코너(나) vs 블루 코너(상대), 비교표 */
.tape { border: 1px solid var(--line); border-radius: 6px; background: var(--raised); overflow: hidden; }
.tape-h { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; }
.corner { padding: 10px 12px; min-width: 0; }
.corner.r { background: var(--red-t); border-bottom: 3px solid var(--red); }
.corner.b { background: var(--blue-t); border-bottom: 3px solid var(--blue); text-align: right; }
.corner .nm { font: 400 18px/1.2 var(--f-display); overflow-wrap: anywhere; }
.corner .gy { font-size: 11.5px; color: var(--sub); overflow-wrap: anywhere; }
.vs { display: grid; place-items: center; padding: 0 8px; font: 400 13px var(--f-display); color: var(--sub); }
.tape-r { display: grid; grid-template-columns: 1fr auto 1fr; padding: 5px 12px; border-top: 1px solid var(--line); font-size: 13px; }
.tape-r span:nth-child(2) { color: var(--sub); font-size: 11.5px; padding: 0 8px; align-self: center; text-align: center; }
.tape-r span:last-child { text-align: right; }
.tape-f { padding: 10px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.score { font: 400 20px/1 var(--f-display); }

/* 슬롯·날짜 */
.dates, .slots { display: grid; gap: 6px; }
.dates { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); }
.slots { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
.pick { border: 1px solid var(--line); background: var(--raised); border-radius: 4px; padding: 7px 4px; font-size: 13px; text-align: center; font-variant-numeric: tabular-nums; }
.pick[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 700; }
.pick[disabled] { background: var(--bg); color: var(--sub); text-decoration: line-through; opacity: .6; cursor: not-allowed; }

/* 폼 */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--sub); }
input[type=text], input[type=number], select, textarea { background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; color: var(--ink); width: 100%; }
textarea { min-height: 64px; resize: vertical; }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
.chk input { margin-top: 3px; }
input[type=range] { width: 100%; accent-color: var(--red); }
.fee { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.fee td { padding: 3px 0; } .fee td:last-child { text-align: right; } .fee tr.t td { border-top: 1px solid var(--line); font-weight: 700; padding-top: 6px; }
.bar { display: grid; grid-template-columns: 54px 1fr 28px; gap: 8px; align-items: center; font-size: 12.5px; }
.bar i { display: block; height: 8px; background: var(--ink); border-radius: 2px; min-width: 2px; }
.bar i.rd { background: var(--red); }
.note { border-left: 3px solid var(--warn); background: var(--warn-t); padding: 8px 10px; font-size: 12.5px; border-radius: 0 4px 4px 0; }
.note.bad { border-left-color: var(--bad); background: var(--red-t); } .note.good { border-left-color: var(--good); background: var(--good-t); } .note.blue { border-left-color: var(--blue); background: var(--blue-t); }

/* 시트(모달) */
.scrim { position: fixed; inset: 0; background: rgba(10,12,16,.5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: min(100%, 460px); max-height: 92vh; overflow-y: auto; border-radius: 10px 10px 0 0; padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet-h { display: flex; align-items: center; gap: 8px; } .sheet-h h2 { flex: 1; font: 400 20px/1.2 var(--f-display); }
.x { background: none; border: 0; font-size: 22px; line-height: 1; color: var(--sub); padding: 2px 6px; }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 5px; z-index: 30; max-width: min(92vw, 420px); font-size: 13px; }
.toast.err { background: var(--bad); color: #fff; }
.demo { border: 1px dashed var(--warn); background: var(--warn-t); border-radius: 6px; padding: 12px; }
.mono { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); } } }

</style>
<div class="app" id="app"></div>
<script>
/* 맞수 — 스파링 매칭 서비스 코어 로직 (화면과 분리, node에서 테스트 가능) */
const Core = (() => {
  const LEVELS = ['입문', '초급', '중급', '상급', '선수급'];
  const REGIONS = { '성동': ['성동', '중구', '광진', '동대문'], '중구': ['중구', '성동', '동대문'], '광진': ['광진', '성동', '동대문'], '동대문': ['동대문', '성동', '중구', '광진'] };
  const INTENSITY = { 1: '가볍게(기술 위주)', 2: '보통(적당한 압박)', 3: '강하게(실전에 가깝게)' };
  const INT_CAP = { 1: '가볍게까지', 2: '보통까지', 3: '강하게까지' }; // 이용자가 받을 수 있는 가장 센 강도

  // 참가비 구성: 인터뷰의 스파링 데이 참가비(1~2만 원)를 참고한 가정값. 실제 금액은 체육관 협의로 정한다.
  const FEE_IS_ASSUMPTION = true;
  const FEES = {
    match:  { items: [['링 사용료', 8000], ['주심 수당', 6000], ['보험료', 2000], ['앱 이용 수수료', 4000]], payers: 2 },
    guided: { items: [['지도 스파링 코치비', 12000], ['보험료', 2000], ['앱 이용 수수료', 2000]], payers: 1 },
  };
  function fee(kind) {
    const f = FEES[kind];
    const total = f.items.reduce((s, i) => s + i[1], 0);
    return { items: f.items, total, perPerson: Math.round(total / f.payers), payers: f.payers };
  }

  const weightBand = w => `${Math.floor(w / 5) * 5}~${Math.floor(w / 5) * 5 + 5}kg`;
  const regionNear = (a, b) => a === b ? 0 : ((REGIONS[a] || []).includes(b) ? 1 : 2);

  const isBanned = (u, now) => !!u.bannedUntil && new Date(u.bannedUntil) > now;

  /* 두 사람이 정규 매칭(상호 스파링)이 가능한지. 불가하면 사유를 돌려준다. */
  function eligibility(a, b, opts, now) {
    const o = Object.assign({ crossGender: false, maxWeightGap: 5, anyRegion: false }, opts || {});
    if (a.id === b.id) return { ok: false, why: '본인' };
    if (isBanned(b, now)) return { ok: false, why: '상대 이용 제한 중' };
    if (!b.verified) return { ok: false, why: '상대 레벨 인증 전' };
    if (!a.verified) return { ok: false, why: '내 레벨 인증 전' };
    if (a.gender !== b.gender && !o.crossGender) return { ok: false, why: '성별 불일치' };
    if (a.level <= 2 && b.level <= 2) return { ok: false, why: '초급자끼리는 매칭하지 않음' };
    if (a.level <= 2 || b.level <= 2) return { ok: false, why: '지도 스파링 대상' };
    if (Math.abs(a.level - b.level) > 1) return { ok: false, why: '실력 차이' };
    const gap = Math.abs(a.weight - b.weight);
    if (gap > o.maxWeightGap) return { ok: false, why: '체급 차이' };
    if (!o.anyRegion && regionNear(a.region, b.region) > 1) return { ok: false, why: '지역 멀음' };
    return { ok: true };
  }

  /* 우선순위: 성별 > 실력 > 체급 > 경력 (코치 인터뷰의 매칭 판단 순서) */
  function score(a, b, opts) {
    const o = Object.assign({ crossGender: false }, opts || {});
    let s = 100;
    const reasons = [];
    if (a.gender !== b.gender) { s -= 40; reasons.push('성별이 다름'); } else reasons.push('같은 성별');
    const ld = Math.abs(a.level - b.level);
    s -= ld * 15;
    reasons.push(ld === 0 ? '같은 레벨' : '레벨 1단계 차이');
    const wg = Math.abs(a.weight - b.weight);
    s -= wg * 2.5;
    reasons.push(`체중 차이 ${wg.toFixed(wg % 1 ? 1 : 0)}kg`);
    const eg = Math.min(5, Math.abs(a.years - b.years));
    s -= eg * 1;
    reasons.push(eg <= 1 ? '경력 비슷함' : `경력 ${Math.abs(a.years - b.years)}년 차이`);
    const rn = regionNear(a.region, b.region);
    if (rn === 1) s -= 3;
    return { score: Math.max(0, Math.round(s)), reasons };
  }

  function candidates(me, pool, opts, now) {
    const out = [];
    pool.forEach(u => {
      const e = eligibility(me, u, opts, now);
      if (e.ok) {
        const sc = score(me, u, opts);
        out.push({ user: u, score: sc.score, reasons: sc.reasons, maxIntensity: Math.min(me.intensityMax, u.intensityMax) });
      }
    });
    out.sort((x, y) => y.score - x.score || x.user.id.localeCompare(y.user.id));
    return out;
  }

  /* 지도 스파링: 초급 이하 이용자는 상급 이상 회원 또는 코치와 연결 (같은 성별 우선) */
  function guidedOptions(me, pool, coaches, now) {
    if (me.level > 2) return [];
    const mates = pool.filter(u => u.id !== me.id && u.verified && u.level >= 4 && !isBanned(u, now) && u.gender === me.gender && regionNear(me.region, u.region) <= 1 && u.guideOk);
    const cs = coaches.filter(c => c.gymId === me.gymId || regionNear(me.region, c.region) <= 1);
    return { mates, coaches: cs };
  }

  return { LEVELS, REGIONS, INTENSITY, INT_CAP, FEES, FEE_IS_ASSUMPTION, fee, weightBand, regionNear, isBanned, eligibility, score, candidates, guidedOptions };
})();

/* 상태·시간·슬롯·시드 데이터 */
const Store = (() => {
  const pad = n => String(n).padStart(2, '0');
  const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const ts = (date, time) => { const [y, m, d] = date.split('-').map(Number); const [h, mi] = time.split(':').map(Number); return new Date(y, m - 1, d, h, mi); };
  const addMin = (time, min) => { const [h, m] = time.split(':').map(Number); const t = h * 60 + m + min; return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`; };
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const dateLabel = date => { const d = ts(date, '00:00'); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; };

  const OPEN = '09:30', CLOSE = '23:00', BREAK_FROM = '11:30', BREAK_TO = '15:00'; // 일반 회원 브레이크(선수부 훈련)
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };

  function weekdays(now, n) {
    const out = []; const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    while (out.length < n) { if (d.getDay() >= 1 && d.getDay() <= 5) out.push(dstr(d)); d.setDate(d.getDate() + 1); }
    return out;
  }
  const slotKey = (gymId, date, start) => `${gymId}|${date}|${start}`;
  const ACTIVE = ['requested', 'accepted', 'confirmed', 'ready'];

  function slotsFor(state, gymId, date, now) {
    const out = []; const dow = ts(date, '00:00').getDay();
    if (dow < 1 || dow > 5) return out;
    for (let t = toMin(OPEN); t + 30 <= toMin(CLOSE); t += 30) {
      const start = `${pad(Math.floor(t / 60))}:${pad(t % 60)}`;
      if (t >= toMin(BREAK_FROM) && t < toMin(BREAK_TO)) continue;
      const key = slotKey(gymId, date, start);
      let st = 'free';
      if (ts(date, start) < new Date(now.getTime() + 2 * 3600000)) st = 'past';
      else if (state.closed.includes(key)) st = 'closed';
      else if (state.bookings.some(b => ACTIVE.includes(b.status) && slotKey(b.gymId, b.date, b.start) === key)) st = 'taken';
      out.push({ start, end: addMin(start, 30), state: st, key });
    }
    return out;
  }

  const nextId = (state, p) => `${p}${++state.seq}`;
  function notify(state, uid, text, now) { state.notes.unshift({ id: nextId(state, 'n'), uid, text, at: now.toISOString(), read: false }); }

  function seed(now, withHistory) {
    const d = weekdays(now, 12);

/* 예약 생명주기: 요청 → 수락 → 동의·장비·결제 → 확정 → 체크인 → 종료, 취소·노쇼 정책 */

/* ── 취소 시트 ── */

A.reportOpen = d => openSheet({ type: 'report', title: '스파링 리포트', id: d.id, manner: 0, control: 0, skill: '', intensityFelt: 0, injured: null, injuryNote: '' });

    <ol>
      <li><b>레벨 인증</b>: 회원이 요청한 레벨을 보고 승인하거나 반려합니다. 상대 평가가 쌓여 레벨을 다시 볼 필요가 있는 회원도 여기에 뜹니다.</li>
      <li><b>링·대진</b>: 오늘 잡힌 스파링을 보고 주심을 정하고, 도착한 회원을 체크인 처리한 뒤 시작·종료를 누릅니다. 아래에서 링을 열 시간과 닫을 시간을 정합니다.</li>
      <li><b>스파링 데이</b>: 행사 신청이 모이면 대진 자동 편성을 눌러 상대와 순서를 짭니다. 참가자에게는 도착 시각이 안내됩니다.</li>
      <li><b>사고·정산</b>: 회원이 리포트로 신고한 부상을 확인하고 처리 결과를 남깁니다. 결제와 링 사용료 정산 요약도 여기서 봅니다.</li>
    </ol>
    <div class="note blue">실제 서비스에서는 회원과 체육관이 각자 다른 계정으로 로그인합니다. 이 시연판에서는 한 사람이 위의 이용자/체육관 버튼으로 두 화면을 오가며 볼 수 있게 했습니다.</div>`;
  return `<div class="filter" role="group" aria-label="안내 대상"><button data-act="helpView" data-v="user" aria-pressed="${s.view === 'user'}">이용자 화면</button><button data-act="helpView" data-v="console" aria-pressed="${s.view === 'console'}">체육관 화면</button></div>
    <div class="guide stack">${s.view === 'user' ? user : con}</div>
    <p class="sub">이 앱은 수업 과제용 시연판입니다. 결제와 본인인증은 실제로 일어나지 않고, 체육관 이름과 금액은 예시입니다. <b>내 정보</b> 아래의 시연 도구로 상대 응답이나 시간 흐름을 흉내 낼 수 있습니다.</p>`;
};

/* 체육관 콘솔: 레벨 인증, 링·대진, 스파링 데이, 사고·정산 */
const gymBar = () => { const g = S.gym(st, ui.gymSel); return `<div class="row wrap"><label class="f sp">체육관<select data-bind="ui.gymSel" data-render="1">${st.gyms.map(x => `<option value="${x.id}" ${x.id === ui.gymSel ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label><div class="sub" style="align-self:flex-end;padding-bottom:8px">담당 ${esc(byId(st.coaches, g.coachId).nick)}</div></div>`; };
const gymUsers = () => st.users.filter(u => u.gymId === ui.gymSel && u.id !== st.meId || (u.id === st.meId && u.gymId === ui.gymSel));

V.c_verify = () => {
  const reqs = st.verifyReqs.filter(v => v.status === 'pending' && S.user(st, v.uid).gymId === ui.gymSel);
  const decided = st.verifyReqs.filter(v => v.status !== 'pending' && S.user(st, v.uid).gymId === ui.gymSel).slice(-4).reverse();
  const hints = gymUsers().map(u => ({ u, h: G.levelHint(st, u.id) })).filter(x => x.h.kind === 'up' || x.h.kind === 'down');
  return `<div class="stack"><h1>레벨 인증</h1>${gymBar()}
    <p class="sub">이용자가 요청한 레벨을 소속 체육관 코치가 확인하고 승인합니다. 승인된 레벨만 매칭에 쓰입니다.</p>
    <section class="stack"><h2>확인 대기 ${reqs.length}건</h2>${reqs.length ? reqs.map(v => { const u = S.user(st, v.uid); const s = G.userStats(st, u.id); return `<div class="panel stack"><div class="row wrap"><div class="sp grow"><b>${esc(u.nick)}</b> <span class="chip">${sexLabel(u.gender)} · ${C.weightBand(u.weight)} · 경력 ${u.years}년</span><div class="sub">${lvName(v.from)} → ${lvName(v.to)} 요청 · 스파링 ${u.sparCount}회</div></div></div>
      ${v.note ? `<p>근거: ${esc(v.note)}</p>` : ''}<div class="row wrap"><label class="f sp">승인 레벨<select id="vl-${v.id}">${C.LEVELS.map((l, i) => `<option value="${i + 1}" ${v.to === i + 1 ? 'selected' : ''}>${l}</option>`).join('')}</select></label><button class="btn sm red" data-act="vOk" data-id="${v.id}">승인</button><button class="btn sm ghost" data-act="vNo" data-id="${v.id}">반려</button></div></div>`; }).join('') : '<div class="panel flat empty">대기 중인 요청이 없습니다.</div>'}</section>
    <section class="stack"><h2>코치 확인 추천</h2>${hints.length ? `<div class="list">${hints.map(x => `<div><b>${esc(x.u.nick)}</b> <span class="chip ${x.h.kind === 'up' ? 'good' : 'warn'}">${x.h.kind === 'up' ? '승급 평가' : '레벨 재확인'}</span><div class="sub">${esc(x.h.text)}</div></div>`).join('')}</div>` : '<div class="panel flat empty">상대 평가가 5건 이상 쌓인 이용자 중 추천 대상이 없습니다.</div>'}</section>
    ${decided.length ? `<section class="stack"><h2>최근 처리</h2><div class="list">${decided.map(v => `<div class="row"><span class="sp">${esc(nick(v.uid))}</span><span class="chip ${v.status === 'approved' ? 'good' : ''}">${v.status === 'approved' ? '승인 ' + lvName(v.final) : '반려'}</span></div>`).join('')}</div></section>` : ''}</div>`;
};
A.vOk = d => { const lv = Number(document.getElementById('vl-' + d.id).value); done(G.decideVerification(st, d.id, S.gym(st, ui.gymSel).coachId, true, lv, now()), '승인했습니다.'); };
A.vNo = d => done(G.decideVerification(st, d.id, S.gym(st, ui.gymSel).coachId, false, null, now()), '반려했습니다.');

V.c_ring = () => {
  const date = ui.day && st.dates.includes(ui.day) ? ui.day : st.dates[1]; const slots = S.slotsFor(st, ui.gymSel, date, now());
  const bks = st.bookings.filter(b => b.gymId === ui.gymSel && b.date === date && (F.isActive(b) || ['done', 'noshow'].includes(b.status))).sort((a, b) => a.start.localeCompare(b.start));
  return `<div class="stack"><h1>링·대진</h1>${gymBar()}
    <div class="dates">${st.dates.slice(0, 7).map(d => `<button class="pick" data-act="cDay" data-v="${d}" aria-pressed="${d === date}">${esc(S.dateLabel(d).replace(/^\d+월 /, ''))}</button>`).join('')}</div>
    <section class="stack"><h2>대진 현황 ${bks.length}건</h2>${bks.length ? bks.map(b => ringItem(b)).join('') : '<div class="panel flat empty">이 날 예약된 대진이 없습니다.</div>'}</section>
    <section class="stack"><h2>링 슬롯 열기·닫기</h2><p class="sub">링 1개 기준, 30분 단위입니다. 닫은 시간은 이용자에게 보이지 않습니다. 이미 예약된 시간은 닫을 수 없습니다.</p>
      <div class="slots">${slots.filter(x => x.state !== 'taken').map(x => `<button class="pick" data-act="cSlot" data-k="${x.key}" ${x.state === 'past' ? 'disabled' : ''} aria-pressed="${x.state === 'closed'}" title="${x.state === 'closed' ? '닫힘' : '열림'}">${x.start}${x.state === 'closed' ? ' 닫힘' : ''}</button>`).join('') || '<p class="sub">운영하지 않는 날입니다.</p>'}</div></section></div>`;
};
function ringItem(b) {
  const a = S.user(st, b.aId), o = S.user(st, b.bId); const g = S.gym(st, b.gymId);
  const refs = st.referees.filter(r => r.regions.includes(g.region));
  const ci = F.parties(b).map(p => `${esc(nick(p))} ${b.checkIn[p] ? '<span class="chip good">체크인</span>' : '<span class="chip">체크인 전</span>'}`).join(' ');
  const act = b.status === 'confirmed' ? `<button class="btn sm" data-act="cStart" data-id="${b.id}">시작</button>` : b.status === 'ready' ? `<button class="btn sm red" data-act="cEnd" data-id="${b.id}">종료 처리</button>` : '';
  return `<div class="panel stack"><div class="row wrap"><b class="mono">${b.start}</b><span class="sp grow">${esc(a.nick)} <span class="sub">vs</span> ${esc(o.nick)} <span class="sub">${b.kind === 'guided' ? '지도' : '정규'}</span></span>${statusChip(b)}</div>
    <div class="row wrap sub">${esc(C.INTENSITY[b.intensity])} · ${ci}</div>
    ${b.kind === 'match' && ['accepted', 'confirmed', 'ready'].includes(b.status) ? `<div class="row wrap"><label class="f sp">주심<select data-act="cRef" data-id="${b.id}">${b.refereeId ? '' : '<option value="">배정 필요</option>'}${refs.map(r => `<option value="${r.id}" ${b.refereeId === r.id ? 'selected' : ''}>주심 ${esc(r.name)} (${esc(r.cert)})</option>`).join('')}</select></label></div>` : ''}
    ${b.needsReferee ? '<div class="note bad">배정 가능한 주심이 없습니다. 주심을 지정해야 시작할 수 있습니다.</div>' : ''}
    <div class="row wrap">${act}${b.status === 'confirmed' ? F.parties(b).filter(p => !b.checkIn[p]).map(p => `<button class="btn sm ghost" data-act="cCI" data-id="${b.id}" data-u="${p}">${esc(nick(p))} 현장 체크인</button>`).join('') : ''}</div></div>`;
}
A.cDay = d => { ui.day = d.v; render(); };
A.cSlot = d => { G.toggleSlot(st, d.k); persist(); render(); };
A.cStart = d => done(F.start(st, d.id, now()), '스파링을 시작했습니다.');
A.cEnd = d => done(F.complete(st, d.id, now()), '종료 처리했습니다. 참가자에게 리포트 작성이 안내됩니다.');
A.cCI = d => done(F.checkIn(st, d.id, d.u, now()), '체크인했습니다.');
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.act === 'cRef' && t.value) done(G.setReferee(st, t.dataset.id, t.value), '주심을 배정했습니다.'); });

V.c_event = () => {
  const evs = st.events.filter(e => e.gymId === ui.gymSel);
  return `<div class="stack"><h1>스파링 데이</h1>${gymBar()}
    <p class="sub">신청이 끝나면 같은 규칙(성별 → 실력 → 체급 → 경력)으로 대진을 자동 편성하고, 참가자마다 몇 시까지 오면 되는지 알림으로 보냅니다.</p>
    ${evs.length ? evs.map(ev => `<div class="panel stack"><div class="row wrap"><h3 class="sp grow">${esc(ev.title)}</h3><span class="chip">${esc(S.dateLabel(ev.date))} ${ev.start}</span></div>
      <p class="sub">신청 ${ev.applicants.length}/${ev.capacity} · ${ev.applicants.map(nick).map(esc).join(', ') || '없음'}</p>
      ${ev.bracket ? bracketTable(ev) + `<p class="sub">1대진당 ${ev.bracket.blockMin}분(3라운드 + 정비)으로 링 ${ev.rings}면에 순서대로 배정했습니다.</p>` : ''}
      <button class="btn sm ${ev.bracket ? 'ghost' : 'red'}" data-act="cBuild" data-id="${ev.id}">${ev.bracket ? '대진 다시 편성' : '대진 자동 편성'}</button></div>`).join('') : '<div class="panel flat empty">예정된 스파링 데이가 없습니다.</div>'}</div>`;
};
A.cBuild = d => { const ev = st.events.find(e => e.id === d.id); ev.bracket = null; done(G.buildBracket(st, d.id, now()), '대진을 편성하고 참가자에게 알렸습니다.'); };

V.c_safe = () => {
  const r = G.dayReport(st, ui.gymSel); const inc = st.incidents.filter(i => i.gymId === ui.gymSel);
  const lg = st.ledger.filter(l => st.bookings.some(b => b.id === l.bookingId && b.gymId === ui.gymSel)).slice(-6).reverse();
  return `<div class="stack"><h1>사고·정산</h1>${gymBar()}
    <section class="stack"><h2>사고 기록</h2>${inc.length ? `<div class="list">${inc.map(i => `<div class="row wrap"><div class="sp grow"><b>${esc(nick(i.uid))}</b> <span class="chip ${i.status === 'open' ? 'warn' : 'good'}">${i.status === 'open' ? '확인 필요' : '처리 완료'}</span><div class="sub">${esc(i.note)}</div></div>${i.status === 'open' ? `<button class="btn sm" data-act="cInc" data-id="${i.id}">처리 완료</button>` : ''}</div>`).join('')}</div>` : '<div class="panel flat empty">접수된 사고가 없습니다.</div>'}
      <p class="sub">부상 신고는 코치에게 즉시 전달되고, 참가 동의서·장비 확인·주심 정보와 함께 보관됩니다.</p></section>
    <section class="panel stack"><h2>정산 요약</h2>
      <div class="row"><span class="sp">전체 예약</span><b class="mono">${r.bookings}건</b></div><div class="row"><span class="sp">진행 중·예정</span><b class="mono">${r.active}건</b></div>
      <div class="row"><span class="sp">종료</span><b class="mono">${r.done}건</b></div><div class="row"><span class="sp">취소 · 노쇼</span><b class="mono">${r.cancelled} · ${r.noshow}건</b></div>
      <div class="row"><span class="sp">실제 결제 금액 (환불 제외)</span><b class="mono">${won(r.netCharged)}</b></div><div class="row"><span class="sp">링 사용료 정산 예정 (종료 건)</span><b class="mono">${won(r.ringShare)}</b></div>
      <p class="sub">금액 기준은 시연용 가정값입니다. 링 사용료는 종료된 스파링 1건당 ${won(8000)}으로 계산했습니다.</p></section>
    <section class="stack"><h2>최근 결제 내역</h2>${lg.length ? `<div class="list">${lg.map(l => `<div class="row"><span class="sp">${esc(nick(l.uid))}</span><span class="chip ${l.type === 'refund' ? 'warn' : ''}">${l.type === 'refund' ? '환불' : '결제'}</span><b class="mono">${won(l.amount)}</b></div>`).join('')}</div>` : '<div class="panel flat empty">내역이 없습니다.</div>'}</section></div>`;
};
A.cInc = d => done(G.resolveIncident(st, d.id), '처리 완료로 표시했습니다.');

const $app = document.getElementById('app');
st = restore() || (() => { const s = S.seed(new Date(), true); return s; })();
if (carried) { const u = S.user(st, st.meId); ['nick', 'gender', 'intensityMax', 'weight', 'years', 'gymId', 'region', 'level', 'verified', 'consents'].forEach(k => { if (carried[k] !== undefined) u[k] = carried[k]; }); }
persist(); render();

</script>
